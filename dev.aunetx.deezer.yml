app-id: dev.aunetx.deezer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: run.sh
separate-locales: false
tags: [proprietary]
finish-args:
  # Basic permissions
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  # DBus permissions
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.gnome.SettingsDaemon
  - --talk-name=org.gnome.SessionManager
  - --own-name=org.mpris.MediaPlayer2.deezer
  # Fs access: music to send mp3
  - --filesystem=xdg-music:ro
modules:
  - name: deezer
    buildsystem: simple
    sources:
      # The application datas
      - type: file
        path: dev.aunetx.deezer.appdata.xml
      # Wrapper to launch the app
      - type: script
        dest-filename: run.sh
        commands:
          # GNOME loads the tray icon from a file Chromium writes to TMPDIR;
          # /var/tmp is private to the sandbox, so use the path shared with the host
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - zypak-wrapper /app/main/deezer-desktop "$@"
      - type: archive
        url: https://github.com/aunetx/deezer-linux/releases/download/v8.0.10/deezer-desktop-8.0.10-x64.tar.xz
        sha256: 17a9ed464d41cd18372d54f0e1c63be7767cb9d8a97add236f9237accacad199
        only-arches: [x86_64]
        dest: archive
        x-checker-data:
          type: json
          url: https://api.github.com/repos/aunetx/deezer-linux/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^v"; "") | sub("-[0-9]$"; "")
          url-query: .assets[] | select(.name=="deezer-desktop-" + $version + "-x64.tar.xz")
            | .browser_download_url
      - type: archive
        url: https://github.com/aunetx/deezer-linux/releases/download/v8.0.10/deezer-desktop-8.0.10-arm64.tar.xz
        sha256: afd0159c59bafd21ff2ee1a6b67e4dd7c563b61bcd839bb51a133874bde91c35
        only-arches: [aarch64]
        dest: archive
        x-checker-data:
          type: json
          url: https://api.github.com/repos/aunetx/deezer-linux/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^v"; "") | sub("-[0-9]$"; "")
          url-query: .assets[] | select(.name=="deezer-desktop-" + $version + "-arm64.tar.xz")
            | .browser_download_url
    build-commands:
      - cp -a archive /app/main

      # Install app wrapper
      - install -Dm755 -t /app/bin/ run.sh

      # Install app datas
      - install -Dm644 dev.aunetx.deezer.appdata.xml /app/share/appdata/dev.aunetx.deezer.appdata.xml
      - install -Dm644 /app/main/resources/dev.aunetx.deezer.svg /app/share/icons/hicolor/scalable/apps/dev.aunetx.deezer.svg
      - install -Dm644 /app/main/resources/dev.aunetx.deezer.desktop /app/share/applications/dev.aunetx.deezer.desktop
      - patch-electron-desktop-filename /app/main/resources/app.asar
